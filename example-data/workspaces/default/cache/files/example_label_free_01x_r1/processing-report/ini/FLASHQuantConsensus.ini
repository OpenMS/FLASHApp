<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="FLASHQuantConsensus" description="Quantification of FLASHDeconv features across runs, with match between runs.">
    <ITEM name="version" value="3.6.0-pre-FDmerge-2026-11-09" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;FLASHQuantConsensus&apos;">
      <ITEMLIST name="in" type="input-file" description="The runs as given to FLASHDeconv: mzML files (centroided), or Thermo .raw files (recognised by their extension; read with Thermo&apos;s peak picking, as ThermoRawFileParser converts them by default; needs OpenMS built with WITH_THERMO_RAW and the .NET 8 runtime)." required="true" advanced="false" supported_formats="*.mzML,*.raw">
      </ITEMLIST>
      <ITEMLIST name="in_feature" type="input-file" description="FLASHDeconv feature tsv files (-out) of the runs, in the order of -in." required="true" advanced="false" supported_formats="*.tsv">
      </ITEMLIST>
      <ITEM name="out" value="" type="output-file" description="Consensus feature tsv: per feature its mass, aligned apex and charges, and per run (named by the base name of its -in file; a name two inputs share gets the run&apos;s position appended, _1, _2, ...) its abundance, status (detected; mbr: a match between runs; mbr_id: one the run identifies, -in_id; or nan) and, for a match between runs, its score (FLASHDeconv&apos;s Qscore2D of the mass, see above) and q-value (for mbr_id, that of the identified transfers)." required="true" advanced="false" supported_formats="*.tsv" />
      <ITEM name="min_run_fraction" value="0.25" type="double" description="Consensus features detected in at least this fraction of the runs are quantified in every run (where not detected, by match between runs at -mbr_fdr). Lower values quantify more features, but their many weak transfers raise the score threshold of all transfers (PXD042169: 0.25 doubled the quantified features over 0.5 at the same accuracy; features in &gt;= 2 runs lost transfers of the strong features)." required="false" advanced="false" restrictions="0.0:1.0" />
      <ITEM name="out_mbr_detail" value="" type="output-file" description="Match between runs, per consensus feature and run (detected or transfer): the value, FLASHDeconv&apos;s evidence for the mass (Qscore2D, best scan Qscore, scans found, mass error), the same for its decoy where not detected, the feature&apos;s own mass error where detected (the reference of the mass errors) and its median abundance where detected; fields not computed (no evidence with -mbr_fdr &lt; 0, no decoy for a detected run) are empty. With -in_id, also whether the run identifies the mass (Identified) and the decoy mass (DecoyIdentified) of a transfer." required="false" advanced="true" supported_formats="*.tsv" />
      <ITEM name="mbr_fdr" value="0.01" type="double" description="Match between runs: values are kept up to this FDR (target-decoy, see above); 1 keeps every value, a negative value switches match between runs off (NaN where not detected)." required="false" advanced="false" />
      <ITEMLIST name="in_id" type="input-file" description="Optional: FLASHTnT PrSM tsv files (-out_prsm) of the runs, in the order of -in. They mark the transfers whose values are as reliable as detected ones (status mbr_id) and add few values (see above; PXD042169: +0.1-0.2% values, as 97-99% of the identified transfers pass on FLASHDeconv&apos;s evidence anyway; values off by more than 2-fold: mbr_id 0.1%, mbr 2.6%, detected 1.3%). A transfer whose run identifies its mass (a PrSM in its window: target protein, not a decoy precursor, proteoform q-value &lt;= -id_fdr; its precursor mass equal to the transfer&apos;s, or one isotope off, within three times the median error of the identifications of the features where detected; FLASHDeconv&apos;s tolerance if none is identified) and with a raw abundance is kept with the status mbr_id, whatever FLASHDeconv&apos;s evidence, if the identified transfers pass -mbr_fdr as a class: the decoy masses identified the same way over the identified transfers; else they are judged like the others. The other transfers are judged by FLASHDeconv&apos;s evidence without the kept identified ones among their targets: their q-values are never lower than without identifications. Needs a FLASHTnT search of every run, with q-values (a database with decoys). Without it, nothing changes." required="false" advanced="false" supported_formats="*.tsv">
      </ITEMLIST>
      <ITEM name="out_id" value="" type="output-file" description="With -in_id: the identifications of the consensus features. One row per PrSM of -in_id (target protein, not a decoy precursor, proteoform q-value &lt;= -id_fdr) assigned to a consensus feature: the PrSM lies in the feature&apos;s window in its run and its precursor mass is the feature&apos;s mass, or one isotope off, within FLASHDeconv&apos;s tolerance (the nearest feature if several qualify). Columns: ConsensusIndex, Run (as in -out), the PrSM&apos;s PrSMIndex, Scan, RetentionTime, ProteinAccession, ProteinDescription, ProteoformIndex, Proforma, ProteoformMass, PrecursorMass, ProteoformLevelQvalue, and the MassErrorPPM of the match (nearest isotope). Detected runs and transfers alike; a feature without a row is not identified. Without it, nothing changes." required="false" advanced="false" supported_formats="*.tsv" />
      <ITEM name="id_fdr" value="0.01" type="double" description="With -in_id: the PrSMs used, by their proteoform-level q-value." required="false" advanced="false" restrictions="0.0:1.0" />
      <ITEM name="mbr_min_score" value="0.0" type="double" description="Match between runs: transfers other than mbr_id (status mbr) are kept only with a score (Qscore2D) at least this, besides -mbr_fdr; mbr_id ones always pass. The FDR says that the mass is there, not how exact the value is, and a higher score does not make it more exact: PXD042169 SpikeIn, E. coli values off by more than 2-fold: mbr of Qscore2D &gt;= 0.95 2.9%, &lt; 0.95 2.3% (mbr_id 0.1%, detected 1.3%); 0.5 / 0.8 / 0.95 kept 97 / 82 / 59% of the transfers." required="false" advanced="false" restrictions="0.0:1.0" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool (0 = all available cores)" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
