apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/memory-tier-high

namePrefix: flashapp-

commonLabels:
  app: flashapp

images:
  - name: openms-streamlit
    newName: ghcr.io/openms/flashapp
    # A release image, not the deployed one: under Argo CD the ImageUpdater
    # (k8s/argocd/image-updater.yaml) sets the latest release on the
    # Application. This tag is only where a new Application starts and the
    # name CI loads its test image under, so it need not follow releases.
    newTag: 2.0.0-alpha-full

# FLASHApp's own values. k8s/base and k8s/components are the template's and
# arrive through the template sync; everything this app sets for itself is a
# patch here (docs/kubernetes-deployment.md, "App values belong in the overlay").
patches:
  # This app's values belong here, not in k8s/base or k8s/components: those
  # are template-owned and reach every app through the template sync. The
  # workspace share size is one such value (deploy.k8s.storage in app.yaml
  # must match it; `python -m utils.app_spec` compares them). Worker sizes
  # and counts are patched the same way, see docs/kubernetes-deployment.md.
  - target:
      kind: PersistentVolumeClaim
      name: workspaces-manila-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 50Gi
  - target:
      kind: IngressRoute
      name: streamlit-traefik
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: (Host(`flashapp.webapps.openms.de`) || Host(`flashapp.webapps.openms.org`)) && PathPrefix(`/`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: flashapp-streamlit
      - op: replace
        path: /spec/routes/1/match
        value: (Host(`flashapp.webapps.openms.de`) || Host(`flashapp.webapps.openms.org`)) && PathPrefix(`/sync`)
      - op: replace
        path: /spec/routes/1/services/0/name
        value: flashapp-sync
  # The workspace share (deploy.k8s.storage in app.yaml).
  - target:
      kind: PersistentVolumeClaim
      name: workspaces-manila-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 300Gi
  - target:
      kind: Deployment
      name: streamlit
    patch: |
      - op: replace
        path: /spec/replicas
        value: 10
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://flashapp-redis:6379/0"
      # FLASHApp's Streamlit size, larger than the tier's 4Gi limit.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {memory: 512Mi, cpu: 500m}
          limits: {memory: 10Gi, cpu: "4"}
  - target:
      kind: Deployment
      name: sync
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://flashapp-redis:6379/0"
  - target:
      kind: Deployment
      name: rq-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://flashapp-redis:6379/0"
      # FLASHApp's worker size: five workers of up to 20Gi each, not the
      # tier's single 180Gi worker.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {memory: 2Gi, cpu: "2"}
          limits: {memory: 20Gi, cpu: "4"}
