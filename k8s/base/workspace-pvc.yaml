apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces-pvc
  annotations:
    # Argo CD must never prune or delete these: they hold the users' workspaces.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cinder-csi
  resources:
    requests:
      storage: 3Ti
