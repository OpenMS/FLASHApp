<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout editor</title>
<style>
  :root {
    --primary: #ff4b4b;
    --bg: #ffffff;
    --bg2: #f0f2f6;
    --text: #31333f;
    --border: rgba(49, 51, 63, 0.2);
    --muted: rgba(49, 51, 63, 0.6);
    --danger: #d33;
    --ok: #21a366;
    --font: "Source Sans Pro", "Source Sans 3", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--text); font-family: var(--font); font-size: 15px; }
  body { padding: 2px 2px 8px; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar .spacer { flex: 1 1 auto; }
  .btn { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 5px 12px; line-height: 1.4; }
  .btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stepper button { border: 0; background: var(--bg); padding: 5px 10px; }
  .stepper button:disabled { opacity: .4; cursor: default; }
  .stepper span { padding: 0 8px; min-width: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }
  .label { color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

  .status { font-size: 13px; margin: -4px 0 10px; min-height: 18px; color: var(--muted); }
  .status.dirty { color: #b7791f; }
  .status.saved { color: var(--ok); }
  .status.error { color: var(--danger); }

  .main { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 640px) { .main { grid-template-columns: minmax(0, 1fr); } }

  .palette { border: 1px solid var(--border); background: var(--bg2); border-radius: 10px; padding: 10px; position: sticky; top: 0; }
  .palette h4 { margin: 0 0 2px; font-size: 14px; }
  .palette .hint { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .palette .search { width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 14px; margin-bottom: 4px; user-select: text; -webkit-user-select: text; }
  .palette .search:focus { outline: none; border-color: var(--primary); }
  .palette .bulk { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: 2px; }
  .palette .bulk .link:hover { color: var(--primary); }
  .palette .group { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 5px 2px; margin-top: 2px; border-radius: 6px;
                    font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; }
  .palette .group:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }
  .palette .group .caret { display: inline-block; width: 10px; transition: transform .1s; }
  .palette .group.open .caret { transform: rotate(90deg); }
  .palette .group .name { flex: 1 1 auto; }
  .palette .group .count { font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }
  .palette .chips { display: flex; flex-direction: column; gap: 5px; margin: 2px 0 6px; }
  .palette .empty { font-size: 13px; color: var(--muted); padding: 6px 2px; }
  .chip mark { background: color-mix(in srgb, var(--primary) 25%, transparent); color: inherit; border-radius: 2px; }
  @media (max-width: 640px) { .palette { position: static; } .palette .chips { flex-direction: row; flex-wrap: wrap; } }
  .palette.drop-over { outline: 2px dashed var(--danger); outline-offset: -4px; }

  .chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); border-radius: 7px; padding: 5px 8px; cursor: grab; touch-action: none; flex-wrap: wrap; font-size: 14px; }
  .chip:hover { border-color: var(--primary); }
  .chip .grip { color: var(--muted); font-size: 12px; letter-spacing: -2px; }
  .chip .lbl { flex: 1 1 0; min-width: 0; }
  .chip .req { flex-basis: 100%; margin-left: 18px; font-size: 11px; color: var(--muted); }
  .chip.used { opacity: .45; }

  .experiments { display: grid; gap: 12px; }
  .experiments.side-by-side { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 640px) { .experiments.side-by-side { grid-template-columns: minmax(0, 1fr); } }
  .exp { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px 10px; background: var(--bg); }
  .exp.active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .exp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .exp-head strong { font-size: 14px; }
  .exp-head .spacer { flex: 1; }
  .link { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 4px; }
  .link:hover { color: var(--danger); }

  .row { display: flex; align-items: stretch; min-height: 54px; }
  .slot { flex: 0 0 8px; border-radius: 6px; transition: flex-basis .08s; }
  body.dragging .slot.open { flex-basis: 26px; background: rgba(128,128,128,.10); }
  .slot.drop-over { flex-basis: 40px !important; background: color-mix(in srgb, var(--primary) 25%, transparent) !important; outline: 2px dashed var(--primary); outline-offset: -2px; }
  .cell { flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; justify-content: center;
          border: 1px solid var(--border); background: var(--bg2); border-radius: 8px; padding: 8px 28px 8px 10px; cursor: grab; touch-action: none; }
  .cell:hover { border-color: var(--primary); }
  .cell .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .sub.bad { color: var(--danger); }
  .cell.invalid { border-color: var(--danger); }
  .cell .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 15px; line-height: 1; }
  .cell .x:hover { background: var(--danger); color: #fff; }
  .cell.drop-over { outline: 2px dashed var(--primary); outline-offset: -3px; }
  .cell.source { opacity: .35; }

  .newrow { height: 8px; border-radius: 6px; transition: height .08s; }
  body.dragging .newrow { height: 18px; }
  .newrow.last { height: auto; min-height: 40px; display: flex; align-items: center; justify-content: center; border: 1.5px dashed var(--border); color: var(--muted); font-size: 13px; margin-top: 6px; }
  body.dragging .newrow.last { min-height: 46px; }
  .newrow.drop-over { background: color-mix(in srgb, var(--primary) 20%, transparent); outline: 2px dashed var(--primary); outline-offset: -2px; height: 30px; }
  .newrow.last.drop-over { border-color: transparent; color: var(--primary); }

  .ghost { position: fixed; z-index: 1000; pointer-events: none; padding: 6px 10px; border-radius: 7px; background: var(--primary); color: #fff;
           font-size: 14px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.25); transform: translate(-50%, -120%); white-space: nowrap; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  .toast { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); background: #333; color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 13px;
           opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 1001; }
  .toast.show { opacity: .95; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<input id="file" type="file" accept=".json,application/json">
<script>
(function () {
  'use strict';

  // ---- Streamlit component protocol (what streamlit-component-lib does) ----
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), '*');
  }
  function setValue(value) { send('streamlit:setComponentValue', { value: value, dataType: 'json' }); }
  var lastHeight = -1;
  function syncHeight() {
    var h = Math.ceil(document.body.scrollHeight);
    if (h !== lastHeight) { lastHeight = h; send('streamlit:setFrameHeight', { height: h }); }
  }

  // ---- State ----
  var cfg = null;          // latest args from Python
  var byName = {};         // component name -> catalog entry
  var draft = null;        // { layout: [[[name]]], sideBySide: bool }
  var revision = null;
  var active = 0;          // experiment that click-to-add targets
  var pending = false;     // a save/reset has been sent and not yet reflected
  var message = null;      // { kind, text } shown in the status line
  var query = '';          // palette search text
  var openGroups = null;   // palette group name -> expanded; null until the catalog is known

  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function label(name) { return byName[name] ? byName[name].label : name; }
  // A component's requirement: one name, or a list of which one is enough
  function reqs(name) {
    var r = byName[name] ? byName[name].requires : null;
    return !r ? [] : (Array.isArray(r) ? r : [r]);
  }
  function reqLabel(name) {
    var c = byName[name];
    return c && c.requires_label ? c.requires_label : reqs(name).map(label).join(' or ');
  }

  function initDraft() {
    // start_layout: a default the user chose to start from, not yet saved
    var src = cfg.start_layout ? cfg.start_layout : (cfg.saved_layout ? cfg.saved_layout : [cfg.default_layout]);
    draft = { layout: clone(src), sideBySide: !!cfg.side_by_side };
    active = 0;
  }

  function savedState() {
    return cfg.saved_layout ? JSON.stringify({ l: cfg.saved_layout, s: !!cfg.side_by_side && cfg.saved_layout.length === 2 }) : null;
  }
  function draftState() {
    return JSON.stringify({ l: draft.layout, s: draft.sideBySide && draft.layout.length === 2 });
  }

  // Mirrors validate_layout() in catalog.py so problems show before Save.
  function problems() {
    var out = { cells: {}, first: '' };
    if (!draft.layout.length) out.first = 'Add at least one experiment';
    draft.layout.forEach(function (exp, e) {
      var names = [].concat.apply([], exp);
      if (!names.length && !out.first) out.first = 'Experiment ' + (e + 1) + ' is empty';
      exp.forEach(function (row, r) {
        row.forEach(function (name, c) {
          var why = '';
          if (!byName[name]) why = 'not available here';
          else if (reqs(name).length && !reqs(name).some(function (r) { return names.indexOf(r) >= 0; })) why = 'needs ' + reqLabel(name);
          if (why) {
            out.cells[e + ',' + r + ',' + c] = why;
            if (!out.first) out.first = label(name) + ' in experiment ' + (e + 1) + ' ' + why;
          }
        });
      });
    });
    return out;
  }

  // ---- Rendering ----
  var app = document.getElementById('app');
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    (children || []).forEach(function (ch) { if (ch) el.appendChild(typeof ch === 'string' ? document.createTextNode(ch) : ch); });
    return el;
  }

  function render() {
    var probs = problems();
    var dirty = draftState() !== savedState();
    var nExp = draft.layout.length;
    if (active >= nExp) active = Math.max(0, nExp - 1);

    var toolbar = h('div', { class: 'toolbar' }, [
      h('span', { class: 'label', text: 'Experiments' }),
      h('span', { class: 'stepper' }, [
        h('button', { title: 'Remove last experiment', disabled: nExp <= 1, onclick: function () { draft.layout.pop(); changed(); } }, ['−']),
        h('span', { text: String(nExp) }),
        h('button', { title: 'Add an experiment', disabled: nExp >= cfg.max_experiments, onclick: function () {
          // Start from the previous experiment's arrangement; comparing files usually wants the same one.
          draft.layout.push(clone(draft.layout[draft.layout.length - 1]));
          active = draft.layout.length - 1; changed();
        } }, ['+'])
      ]),
      nExp === 2 ? h('label', { class: 'toggle', title: 'Show the two experiments next to each other in the Viewer' }, [
        h('input', { type: 'checkbox', checked: draft.sideBySide, onchange: function (ev) { draft.sideBySide = ev.target.checked; changed(); } }),
        'Side-by-side'
      ]) : null,
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn', title: 'Load a layout from a JSON file', onclick: function () { document.getElementById('file').click(); } }, ['Import']),
      h('button', { class: 'btn', title: 'Download this layout as a JSON file', disabled: !!probs.first, onclick: exportLayout }, ['Export']),
      h('button', { class: 'btn', title: 'Forget the saved layout; the Viewer falls back to its default', onclick: resetLayout }, ['Reset']),
      h('button', { class: 'btn primary', disabled: !!probs.first || !dirty || pending, onclick: save }, [pending ? 'Saving…' : 'Save'])
    ]);

    var status;
    if (message) status = h('div', { class: 'status ' + message.kind, text: message.text });
    else if (probs.first) status = h('div', { class: 'status error', text: probs.first });
    else if (dirty) status = h('div', { class: 'status dirty', text: cfg.saved_layout ? 'Unsaved changes' : 'Not saved yet — the Viewer uses its default layout until you save' });
    else status = h('div', { class: 'status saved', text: '✓ Saved — the Viewer uses this layout' });

    // Palette
    var used = usedInActive();
    var groups = paletteGroups();
    var palette = h('div', { class: 'palette', 'data-drop': 'palette' }, [
      h('h4', { text: 'Components' }),
      h('div', { class: 'hint', text: 'Drag into the grid, or click to add to experiment ' + (active + 1) + '. Drag a placed component back here to remove it.' }),
      h('input', { class: 'search', id: 'palette-search', type: 'search', placeholder: 'Search components…', value: query,
                   'aria-label': 'Search components', oninput: onSearch, onkeydown: onSearchKey })
    ]);
    if (groups.length > 1 && !query) {
      var allOpen = groups.every(function (g) { return openGroups[g.name]; });
      palette.appendChild(h('div', { class: 'bulk' }, [
        h('button', { class: 'link', onclick: function () { setAllGroups(!allOpen); } }, [allOpen ? 'Collapse all' : 'Expand all'])
      ]));
    }
    var list = h('div', { class: 'palette-list' });
    paletteList(list, groups, used);
    palette.appendChild(list);

    // Experiments
    var exps = h('div', { class: 'experiments' + (nExp === 2 && draft.sideBySide ? ' side-by-side' : '') });
    draft.layout.forEach(function (exp, e) {
      var box = h('div', { class: 'exp' + (e === active && nExp > 1 ? ' active' : ''), onclick: function () { if (active !== e) { active = e; render(); } } }, [
        h('div', { class: 'exp-head' }, [
          h('strong', { text: 'Experiment ' + (e + 1) }),
          h('span', { class: 'spacer' }),
          [].concat.apply([], exp).length ? h('button', { class: 'link', onclick: function () { draft.layout[e] = []; changed(); } }, ['Clear']) : null,
          nExp > 1 ? h('button', { class: 'link', onclick: function () { draft.layout.splice(e, 1); changed(); } }, ['Remove']) : null
        ])
      ]);
      exp.forEach(function (row, r) {
        if (r > 0) box.appendChild(h('div', { class: 'newrow', 'data-drop': 'newrow', 'data-exp': e, 'data-row': r }));
        var rowEl = h('div', { class: 'row' });
        var open = row.length < cfg.max_columns;
        for (var c = 0; c <= row.length; c++) {
          rowEl.appendChild(h('div', { class: 'slot' + (open ? ' open' : ''), 'data-drop': open ? 'slot' : null, 'data-exp': e, 'data-row': r, 'data-col': c }));
          if (c === row.length) break;
          var why = probs.cells[e + ',' + r + ',' + c];
          var name = row[c];
          rowEl.appendChild(h('div', { class: 'cell' + (why ? ' invalid' : ''), 'data-drag': 'cell', 'data-drop': 'cell', 'data-exp': e, 'data-row': r, 'data-col': c, title: 'Drag to move, drop on another component to swap' }, [
            h('div', { class: 'name', text: label(name) }),
            why ? h('div', { class: 'sub bad', text: why }) : (byName[name] && byName[name].requires ? h('div', { class: 'sub', text: 'linked to ' + reqLabel(name) }) : null),
            h('button', { class: 'x', title: 'Remove', 'data-remove': '1', onclick: (function (e, r, c) { return function () { removeAt(e, r, c); changed(); }; })(e, r, c) }, ['×'])
          ]));
        }
        box.appendChild(rowEl);
      });
      box.appendChild(h('div', { class: 'newrow last', 'data-drop': 'newrow', 'data-exp': e, 'data-row': exp.length },
        [exp.length ? 'Drop here for a new row' : 'Drop a component here to start']));
      exps.appendChild(box);
    });

    var focused = document.activeElement && document.activeElement.id === 'palette-search';
    app.replaceChildren(toolbar, status, h('div', { class: 'main' }, [palette, exps]));
    if (focused) { var f = document.getElementById('palette-search'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    syncHeight();
  }

  // ---- Palette: search and collapsible groups ----
  function matches(c, q) {
    return !q || c.label.toLowerCase().indexOf(q) >= 0 || (c.group || '').toLowerCase().indexOf(q) >= 0;
  }
  function highlight(text, q) {
    var i = q ? text.toLowerCase().indexOf(q) : -1;
    if (i < 0) return [text];
    return [text.slice(0, i), h('mark', { text: text.slice(i, i + q.length) }), text.slice(i + q.length)];
  }
  function paletteGroups() {
    var groups = [];
    cfg.components.forEach(function (c) {
      var g = groups.filter(function (x) { return x.name === c.group; })[0];
      if (!g) { g = { name: c.group, items: [] }; groups.push(g); }
      g.items.push(c);
    });
    return groups;
  }
  function usedInActive() {
    var used = {};
    (draft.layout[active] || []).forEach(function (row) { row.forEach(function (n) { used[n] = true; }); });
    return used;
  }
  // Fill the list below the search field; typing redraws only this part, so the field keeps focus.
  function paletteList(list, groups, used) {
    var q = query.trim().toLowerCase();
    var shown = 0;
    var children = [];
    groups.forEach(function (g) {
      var items = g.items.filter(function (c) { return matches(c, q); });
      if (!items.length) return;
      shown += items.length;
      // While searching every group with a match is open
      var open = q ? true : !!openGroups[g.name];
      var placed = g.items.filter(function (c) { return used[c.name]; }).length;
      children.push(h('button', { class: 'group' + (open ? ' open' : ''), 'aria-expanded': open ? 'true' : 'false', disabled: !!q,
                                   title: q ? '' : (open ? 'Collapse' : 'Expand'),
                                   onclick: function () { openGroups[g.name] = !openGroups[g.name]; storeGroups(); render(); } }, [
        h('span', { class: 'caret', text: '▸' }),
        h('span', { class: 'name', text: g.name || 'Other' }),
        h('span', { class: 'count', title: placed ? placed + ' of ' + g.items.length + ' in experiment ' + (active + 1) : '',
                    text: q ? String(items.length) : (placed ? placed + '/' + g.items.length : String(g.items.length)) })
      ]));
      if (!open) return;
      children.push(h('div', { class: 'chips' }, items.map(function (c) {
        return h('div', { class: 'chip' + (used[c.name] ? ' used' : ''), 'data-drag': 'palette', 'data-name': c.name,
                          title: used[c.name] ? 'Already in experiment ' + (active + 1) : 'Drag or click to add' }, [
          h('span', { class: 'grip', text: '⋮⋮' }),
          h('span', { class: 'lbl' }, highlight(c.label, q)),
          c.requires ? h('span', { class: 'req', text: '+ ' + reqLabel(c.name) }) : null
        ]);
      })));
    });
    if (!shown) children.push(h('div', { class: 'empty', text: 'No component matches “' + query.trim() + '”' }));
    list.replaceChildren.apply(list, children);
  }
  function onSearch(ev) {
    var was = query;
    query = ev.target.value;
    // Starting or clearing a search shows or hides "Expand all": redraw the palette (focus is kept)
    if (!was !== !query) return render();
    var palette = ev.target.closest('.palette');
    paletteList(palette.querySelector('.palette-list'), paletteGroups(), usedInActive());
    syncHeight();
  }
  function onSearchKey(ev) {
    if (ev.key === 'Escape' && query) { ev.stopPropagation(); query = ''; render(); }
    else if (ev.key === 'Enter') {
      // Enter adds the first match that is not yet in the experiment
      var q = query.trim().toLowerCase(), used = usedInActive();
      var hit = cfg.components.filter(function (c) { return q && matches(c, q) && !used[c.name]; })[0];
      if (hit) clickAdd(hit.name);
    }
  }
  var GROUPS_KEY = 'flash-layout-editor-groups';
  function loadGroups() {
    var stored = null;
    try { stored = JSON.parse(window.localStorage.getItem(GROUPS_KEY) || 'null'); } catch (e) { stored = null; }
    openGroups = {};
    paletteGroups().forEach(function (g, i) {
      // Remembered choice, else only the first group starts open
      openGroups[g.name] = stored && g.name in stored ? !!stored[g.name] : i === 0;
    });
  }
  function storeGroups() {
    try {
      var stored = JSON.parse(window.localStorage.getItem(GROUPS_KEY) || '{}') || {};
      Object.keys(openGroups).forEach(function (k) { stored[k] = openGroups[k]; });
      window.localStorage.setItem(GROUPS_KEY, JSON.stringify(stored));
    } catch (e) { /* storage unavailable: the choice lasts while the editor is open */ }
  }
  function setAllGroups(open) {
    Object.keys(openGroups).forEach(function (k) { openGroups[k] = open; });
    storeGroups(); render();
  }

  // ---- Edits ----
  function changed() { message = null; render(); }
  var toastTimer;
  function toast(text) {
    var t = document.getElementById('toast');
    t.textContent = text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function prune(exp) { for (var r = exp.length - 1; r >= 0; r--) if (!exp[r].length) exp.splice(r, 1); }
  function removeAt(e, r, c) { draft.layout[e][r].splice(c, 1); prune(draft.layout[e]); }
  function contains(e, name) { return draft.layout[e].some(function (row) { return row.indexOf(name) >= 0; }); }

  // src: {kind:'palette', name} | {kind:'cell', e, r, c}
  // dst: {kind:'slot'|'cell', e, r, c} | {kind:'newrow', e, r} | {kind:'palette'}
  function drop(src, dst) {
    var L = draft.layout;
    var name = src.kind === 'palette' ? src.name : L[src.e][src.r][src.c];
    if (dst.kind === 'palette') { if (src.kind === 'cell') { removeAt(src.e, src.r, src.c); changed(); } return; }
    var sameExp = src.kind === 'cell' && src.e === dst.e;

    if (dst.kind === 'cell') {
      if (src.kind === 'cell' && src.e === dst.e && src.r === dst.r && src.c === dst.c) return;
      var other = L[dst.e][dst.r][dst.c];
      if (!sameExp && contains(dst.e, name)) return toast(label(name) + ' is already in experiment ' + (dst.e + 1));
      if (src.kind === 'cell') {
        if (!sameExp && contains(src.e, other)) return toast(label(other) + ' is already in experiment ' + (src.e + 1));
        L[src.e][src.r][src.c] = other;
      }
      L[dst.e][dst.r][dst.c] = name;
      return changed();
    }

    if (!sameExp && contains(dst.e, name)) return toast(label(name) + ' is already in experiment ' + (dst.e + 1));
    // Leave a placeholder where the moved cell was so target indices stay valid.
    var HOLE = {};
    if (src.kind === 'cell') L[src.e][src.r][src.c] = HOLE;
    if (dst.kind === 'slot') {
      var row = L[dst.e][dst.r];
      var size = row.filter(function (x) { return x !== HOLE; }).length;
      if (size >= cfg.max_columns) {
        if (src.kind === 'cell') L[src.e][src.r][src.c] = name;
        return toast('A row holds at most ' + cfg.max_columns + ' components');
      }
      row.splice(dst.c, 0, name);
    } else if (dst.kind === 'newrow') {
      L[dst.e].splice(dst.r, 0, [name]);
    }
    L.forEach(function (exp) {
      exp.forEach(function (row, r) { exp[r] = row.filter(function (x) { return x !== HOLE; }); });
      prune(exp);
    });
    active = dst.e;
    changed();
  }

  function clickAdd(name) {
    var exp = draft.layout[active];
    if (!exp) return;
    if (contains(active, name)) return toast(label(name) + ' is already in experiment ' + (active + 1));
    var last = exp[exp.length - 1];
    if (last && last.length < cfg.max_columns) last.push(name); else exp.push([name]);
    changed();
  }

  // ---- Pointer drag and drop (works for mouse, pen and touch) ----
  var drag = null;
  function targetAt(x, y) {
    var el = document.elementFromPoint(x, y);
    return el ? el.closest('[data-drop]') : null;
  }
  function describe(el) {
    var kind = el.getAttribute('data-drop');
    return { kind: kind, e: +el.getAttribute('data-exp'), r: +el.getAttribute('data-row'), c: +el.getAttribute('data-col') };
  }
  document.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0 || ev.target.closest('[data-remove]')) return;
    var el = ev.target.closest('[data-drag]');
    if (!el) return;
    var src = el.getAttribute('data-drag') === 'palette'
      ? { kind: 'palette', name: el.getAttribute('data-name') }
      : { kind: 'cell', e: +el.getAttribute('data-exp'), r: +el.getAttribute('data-row'), c: +el.getAttribute('data-col') };
    drag = { src: src, el: el, x: ev.clientX, y: ev.clientY, started: false, ghost: null, over: null };
    ev.preventDefault();
  });
  document.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    if (!drag.started) {
      if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) < 5) return;
      drag.started = true;
      var name = drag.src.kind === 'palette' ? drag.src.name : draft.layout[drag.src.e][drag.src.r][drag.src.c];
      drag.ghost = h('div', { class: 'ghost', text: label(name) });
      document.body.appendChild(drag.ghost);
      document.body.classList.add('dragging');
      if (drag.src.kind === 'cell') drag.el.classList.add('source');
      syncHeight();
    }
    drag.ghost.style.left = ev.clientX + 'px';
    drag.ghost.style.top = ev.clientY + 'px';
    var over = targetAt(ev.clientX, ev.clientY);
    if (over && over.getAttribute('data-drop') === 'palette' && drag.src.kind !== 'cell') over = null;
    if (over !== drag.over) {
      if (drag.over) drag.over.classList.remove('drop-over');
      if (over) over.classList.add('drop-over');
      drag.over = over;
    }
  });
  function endDrag(commit) {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    document.body.classList.remove('dragging');
    if (d.over) d.over.classList.remove('drop-over');
    if (d.el) d.el.classList.remove('source');
    if (!d.started) { if (commit && d.src.kind === 'palette') clickAdd(d.src.name); return; }
    if (commit && d.over) drop(d.src, describe(d.over)); else render();
  }
  document.addEventListener('pointerup', function () { endDrag(true); });
  document.addEventListener('pointercancel', function () { endDrag(false); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') endDrag(false); });

  // ---- Save, reset, import, export ----
  function save() {
    pending = true; message = null;
    setValue({ action: 'save', layout: draft.layout, side_by_side: draft.sideBySide && draft.layout.length === 2, nonce: Date.now() + Math.random() });
    render();
  }
  function resetLayout() {
    pending = true;
    initDraftFrom([cfg.default_layout], false);
    setValue({ action: 'reset', nonce: Date.now() + Math.random() });
    message = { kind: 'saved', text: 'Reset — the Viewer uses its default layout' };
    render();
  }
  function initDraftFrom(layout, sbs) { draft = { layout: clone(layout), sideBySide: !!sbs }; active = 0; }

  function exportLayout() {
    var blob = new Blob([JSON.stringify(draft.layout)], { type: 'application/json' });
    var a = h('a', { href: URL.createObjectURL(blob), download: 'FLASHViewer_layout_settings.json' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  document.getElementById('file').addEventListener('change', function (ev) {
    var f = ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    f.text().then(function (txt) {
      var data = JSON.parse(txt);
      // Accept the exported list as well as the stored {layout, side_by_side} form.
      var layout = Array.isArray(data) ? data : data.layout;
      var ok = Array.isArray(layout) && layout.length && layout.length <= cfg.max_experiments && layout.every(function (exp) {
        return Array.isArray(exp) && exp.every(function (row) {
          return Array.isArray(row) && row.length <= cfg.max_columns && row.every(function (n) { return typeof n === 'string'; });
        });
      });
      if (!ok) throw new Error('bad');
      initDraftFrom(layout.map(function (exp) { return exp.filter(function (row) { return row.length; }); }), !Array.isArray(data) && data.side_by_side);
      message = { kind: 'dirty', text: 'Imported ' + f.name + ' — press Save to use it' };
      render();
    }).catch(function () { toast('Not a layout file'); });
  });

  // ---- Render events from Streamlit ----
  window.addEventListener('message', function (ev) {
    var data = ev.data;
    if (!data || data.type !== 'streamlit:render') return;
    var args = data.args;
    var theme = data.theme;
    if (theme) {
      var s = document.documentElement.style;
      if (theme.primaryColor) s.setProperty('--primary', theme.primaryColor);
      if (theme.backgroundColor) s.setProperty('--bg', theme.backgroundColor);
      if (theme.secondaryBackgroundColor) s.setProperty('--bg2', theme.secondaryBackgroundColor);
      if (theme.textColor) {
        s.setProperty('--text', theme.textColor);
        s.setProperty('--border', 'color-mix(in srgb, ' + theme.textColor + ' 20%, transparent)');
        s.setProperty('--muted', 'color-mix(in srgb, ' + theme.textColor + ' 60%, transparent)');
      }
      if (theme.font) s.setProperty('--font', theme.font);
    }
    cfg = args;
    byName = {};
    cfg.components.forEach(function (c) { byName[c.name] = c; });
    if (openGroups === null || paletteGroups().some(function (g) { return !(g.name in openGroups); })) loadGroups();
    if (draft === null || args.revision !== revision) { revision = args.revision; initDraft(); }
    pending = false;
    if (args.server_error) message = { kind: 'error', text: 'Not saved: ' + args.server_error };
    else if (message && message.kind === 'error') message = null;
    if (!drag) render();
  });

  window.addEventListener('resize', syncHeight);
  send('streamlit:componentReady', { apiVersion: 1 });
})();
</script>
</body>
</html>
