# Temporary: looks up the FLASHQuant dataset. Removed before merge.
name: Build example results
on:
  push:
    branches: [claude/project-thread-bz4izy]
    paths: [.github/workflows/build-examples.yml]
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List MSV000091923
        run: |
          for h in massive-ftp.ucsd.edu massive.ucsd.edu; do
            echo "== $h"; curl -sS -m 120 --list-only "ftp://$h/v06/MSV000091923/" || true
            curl -sS -m 120 --list-only "ftp://$h/MSV000091923/" || true
          done
          wget -q -m -nH --spider -r -l 6 "ftp://massive-ftp.ucsd.edu/v06/MSV000091923/" -o spider.log || true
          grep -o "ftp://[^ ]*" spider.log | sort -u | head -400
          curl -sS -m 60 "https://massive.ucsd.edu/ProteoSAFe/QueryDatasets?task=N%2FA&file=&pageSize=30&offset=0&query=%257B%2522title_input%2522%253A%2522FLASHQuant%2522%257D" | head -c 2000
