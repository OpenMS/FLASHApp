# Temporary: looks up the FLASHQuant dataset. Removed before merge.
name: Build example results
on:
  push:
    branches: [claude/project-thread-bz4izy]
    paths: [.github/workflows/build-examples.yml]
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: List MSV000091923
        run: |
          echo "== GNPS2 dataset cache"
          curl -sS -m 120 "https://datasetcache.gnps2.org/datasette/database/filename.csv?_stream=on&_size=max&dataset__exact=MSV000091923" | cut -c1-300 | head -300 || true
          echo "== MassIVE file listing"
          curl -sS -m 120 "https://massive.ucsd.edu/ProteoSAFe/QueryDatasetFiles?dataset=MSV000091923" | head -c 3000 || true
          echo
          for path in "" raw peak sequence other; do
            echo "== ftp v05 /$path"
            timeout 90 curl -sS -m 80 --list-only "ftp://massive.ucsd.edu/v05/MSV000091923/$path/" 2>&1 | head -100 || true
          done
          echo "== wget"
          timeout 120 wget -nv --no-remove-listing -O /dev/null "ftp://massive.ucsd.edu/v05/MSV000091923/" 2>&1 | tail -5 || true
          cat .listing 2>/dev/null | head -50 || true
