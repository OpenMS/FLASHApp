# Temporary: looks up the FLASHQuant dataset. Removed before merge.
name: Build example results
on:
  push:
    branches: [claude/project-thread-bz4izy]
    paths: [.github/workflows/build-examples.yml]
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: List MSV000091923
        run: |
          echo "== PROXI"
          curl -sS -m 60 "https://massive.ucsd.edu/ProteoSAFe/proxi/v0.1/datasets/MSV000091923" | head -c 6000 || true
          echo
          base="ftp://massive-ftp.ucsd.edu/v06/MSV000091923"
          list() { timeout 60 curl -sS -m 50 --list-only "$1/" 2>&1 || true; }
          for d1 in $(list "$base"); do
            echo "== $d1"
            for d2 in $(list "$base/$d1" | head -50); do
              echo "  $d1/$d2"
              case "$d2" in *.*) continue;; esac
              for d3 in $(list "$base/$d1/$d2" | head -80); do echo "    $d1/$d2/$d3"; done
            done
          done
