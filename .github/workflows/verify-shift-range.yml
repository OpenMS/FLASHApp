# Temporary: builds FLASHTnT from t0mdavid-m/OpenMS#11 and from its FDmerge base
# in the FLASHApp image, with prints for the IHFA hits, and compares their
# modification ranges on the lysate example (run 6: mirrored pairs bound no shift). Removed before merge.
name: Verify shift ranges
on:
  push:
    branches: [claude/project-thread-f24d31]
    paths: [.github/workflows/verify-shift-range.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    container: ghcr.io/openms/flashapp:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: t0mdavid-m/OpenMS
          ref: claude/project-thread-f24d31
          path: src-openms
          fetch-depth: 0
      - name: Build and run the fix, then the base
        shell: bash
        run: |
          B=$GITHUB_WORKSPACE/example-data/workspaces/default
          C=$B/cache/files/example_lysate_identified
          mkdir data
          cp $C/out_deconv.mzML $C/database.fasta data/
          cp $B/flashtnt/input-files/mzML-files/Label-free_SpikeIn-1x_R1.mzML data/raw.mzML
          export OPENMS_DATA_PATH=/openms/share/
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/../build/lib:/root/miniforge3/envs/streamlit-env/lib
          F=src-openms/src/openms/source/ANALYSIS/TOPDOWN/FLASHExtenderAlgorithm.cpp
          cmake -S src-openms -B ../build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH='/usr/;/usr/local' \
            -DHAS_XSERVER=OFF -DBOOST_USE_STATIC=OFF -DOPENMP=ON -DOPENMS_USE_VCPKG=OFF -DWITH_UV=OFF \
            -DWITH_THERMO_RAW=OFF -DPYOPENMS=OFF > cmake.log 2>&1 || (tail -50 cmake.log; exit 1)
          for v in new old; do
            if [ $v = old ]; then git -C src-openms checkout -q 62615e6b; fi
            /root/miniforge3/envs/streamlit-env/bin/python .github/workflows/dbg_patch.py $F
            cmake --build ../build --target FLASHTnT -j "$(nproc)" 2>&1 | grep -E 'error|Built target FLASHTnT' || true
            test -x ../build/bin/FLASHTnT
            cd data
            s=$SECONDS; ../../build/bin/FLASHTnT -in out_deconv.mzML -in_raw raw.mzML -db database.fasta -tag:min_length 4 -tag:max_length 4 \
              -out_pro $v-pro.tsv -out_tag $v-tag.tsv -out_prsm $v-prsm.tsv -threads 1 > $v.log 2>&1 || (tail -40 $v.log; exit 1)
            echo "$v: $((SECONDS - s)) s"; grep -v DBG $v.log | tail -5
            echo "--- $v IHFA prints"; grep -c DBG $v.log || true
            grep -E 'DBGPATH|DBGRANGE|DBGSRC' $v.log | head -400
            echo "--- $v IHFA mid nodes"; grep -E 'DBGRANGE|DBGMID' $v.log | head -600
            git -C ../src-openms checkout -q -- .
            cd ..
          done
      - name: Compare
        shell: bash
        working-directory: data
        run: |
          /root/miniforge3/envs/streamlit-env/bin/python - <<'PY'
          import csv
          def rows(p):
              r = list(csv.DictReader(open(p), delimiter='\t'))
              return {(x['Scan'], x['ProteinAccession'], x['Proforma'].split('[')[0][:12]): x for x in r}, r
          old, oldr = rows('old-pro.tsv'); new, newr = rows('new-pro.tsv')
          print('proteoforms old', len(oldr), 'new', len(newr))
          q = lambda r: sum(1 for x in r if float(x['ProteoformLevelQvalue'] or 1) <= 0.01)
          print('at q <= 0.01: old', q(oldr), 'new', q(newr))
          changed = 0
          for x in newr:
              o = next((y for y in oldr if y['Scan'] == x['Scan'] and y['ProteinAccession'] == x['ProteinAccession']), None)
              if o is None: continue
              if (o['ModStart'], o['ModEnd'], o['Proforma']) != (x['ModStart'], x['ModEnd'], x['Proforma']):
                  changed += 1
                  print('scan', x['Scan'], x['ProteinAccession'][:22])
                  print('  old', o['ModStart'], o['ModEnd'], o['Proforma'][:110], o['Score'])
                  print('  new', x['ModStart'], x['ModEnd'], x['Proforma'][:110], x['Score'])
          print('changed', changed)
          for r, n in ((oldr, 'old'), (newr, 'new')):
              for x in r:
                  if x['Scan'] == '4248': print(n, 'scan 4248', x['ProteinAccession'][:22], x['ModStart'], x['ModEnd'], x['Proforma'][:120])
          PY
