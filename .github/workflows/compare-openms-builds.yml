name: Compare OpenMS builds
# Runs the six example analyses (example-data/build_examples.py) with the TOPP
# tools of two OpenMS builds and compares every stored result. The Linux
# packages come from the cache openms.yml fills (key per commit), so the
# desktop build has to have built both commits first; the old one falls back
# to the artifact of an earlier desktop build run.
on:
  pull_request:
    paths:
      - .github/workflows/compare-openms-builds.yml
      - .github/scripts/compare_openms_builds.py

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OLD_SHA: a2685a1a6ebb89e77dc7661c38165fc248278674    # t0mdavid-m/OpenMS@FDmerge
  OLD_RUN: "42244752799"                                 # a desktop build of OLD_SHA (artifact fallback)
  NEW_SHA: ade420d17cbd4584312a537b1cb6ebefe659c399    # t0mdavid-m/OpenMS@FDmerge-3.6

jobs:
  run:
    name: Examples (${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: old
            runner: ubuntu-22.04
          - build: new
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Commit
        id: sha
        run: echo "sha=${{ matrix.build == 'old' && env.OLD_SHA || env.NEW_SHA }}" >> "$GITHUB_OUTPUT"
      - name: OpenMS package (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: openms-out
          key: openms-package-v1-Linux-x86_64-t0mdavid-m/OpenMS-${{ steps.sha.outputs.sha }}
      - name: OpenMS package (artifact of an earlier desktop build)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.build == 'old'
        uses: actions/download-artifact@v4
        with:
          name: openms-Linux-x86_64
          path: openms-out
          run-id: ${{ env.OLD_RUN }}
          github-token: ${{ github.token }}
      - name: Install OpenMS
        run: |
          set -euxo pipefail
          deb=$(find openms-out -name '*.deb' | head -n 1)
          [ -n "$deb" ] || { echo "::error::no OpenMS package for ${{ steps.sha.outputs.sha }} (has the desktop build built it?)"; ls -R openms-out || true; exit 1; }
          # Unpacked, not installed: the deb ships headers that collide with
          # runner packages (sqlite3.h); its dependencies come from apt, as in
          # electron/scripts/stage-openms.sh.
          root="$RUNNER_TEMP/openms"
          dpkg-deb -x "$deb" "$root"
          sudo apt-get update -q
          # libOpenMS also links QtNetwork, which the deb does not declare.
          sudo apt-get satisfy -y -q "$(dpkg-deb -f "$deb" Depends), libqt6network6t64 | libqt6network6"
          bin=$(dirname "$(find "$root" -type f -path '*/bin/FLASHDeconv' | head -n 1)")
          share=$(dirname "$(find "$root" -type d -path '*/share/OpenMS/CHEMISTRY' | head -n 1)")
          libs=$(find "$root" -name '*.so*' \( -type f -o -type l \) -exec dirname {} \; | sort -u | paste -sd:)
          # An rpath, not LD_LIBRARY_PATH, which would also hand the deb's
          # libOpenMS to pyOpenMS.
          sudo apt-get install -y -q patchelf
          for f in "$bin"/* $(find "$root" -name '*.so*' -type f); do
            patchelf --force-rpath --set-rpath "$libs" "$f" 2>/dev/null || true
          done
          { echo "PATH=$bin:$PATH"; echo "OPENMS_DATA_PATH=$share"; } >> "$GITHUB_ENV"
          for t in FLASHDeconv FLASHTnT FLASHAnnotator DecoyDatabase FLASHQuantConsensus; do
            if ldd "$bin/$t" | grep 'not found'; then exit 1; fi
          done
          OPENMS_DATA_PATH=$share "$bin/FLASHDeconv" --help 2>&1 | head -n 8 || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Run the examples
        run: |
          python .github/scripts/compare_openms_builds.py run results-${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: examples-${{ matrix.build }}
          path: results-${{ matrix.build }}

  compare:
    needs: run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: examples-old
          path: results-old
      - uses: actions/download-artifact@v4
        with:
          name: examples-new
          path: results-new
      - name: Old build → new build
        run: python .github/scripts/compare_openms_builds.py compare results-old results-new --md old-new.md && cat old-new.md >> "$GITHUB_STEP_SUMMARY"
      - name: Example results in the repository → new build
        run: python .github/scripts/compare_openms_builds.py compare example-data/workspaces/default/cache results-new --md repo-new.md
      - name: Example results in the repository → old build
        run: python .github/scripts/compare_openms_builds.py compare example-data/workspaces/default/cache results-old --md repo-old.md
      - uses: actions/upload-artifact@v4
        with:
          name: comparison
          path: "*.md"
