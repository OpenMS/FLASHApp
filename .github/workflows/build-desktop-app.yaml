name: Build desktop app (Windows, macOS, Linux)

on:
  push:
    branches: ["develop", "deploy"]
  pull_request:
    branches: ["develop", "deploy"]
  release:
    types: [published]
  workflow_dispatch:

# A new push supersedes the multi-hour build of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Define needed TOPP tools here. FileConverter converts Thermo .raw input
# (CommandExecutor.convert_to_mzml) with share/OpenMS/THIRDPARTY/ThermoRawFileParser.
env:
  TOPP_TOOLS: "FLASHDeconv FLASHTnT FLASHAnnotator DecoyDatabase FileConverter"
  OPENMS_VERSION: 3.5.0
  PYTHON_VERSION: 3.11.0
  # macOS/Linux: minor version; the latest patch release from python-build-standalone.
  PYTHON_STANDALONE_VERSION: "3.11"
  # Prefix of the installer names: <APP_NAME>-Setup.exe, -macOS-arm64.dmg,
  # -Linux-x86_64.AppImage, -Linux-amd64.deb.
  APP_NAME: FLASHApp-1.1.0
  # Electron app name without the version, so the install folder and the
  # workspaces in %APPDATA%\FLASHApp stay the same across upgrades.
  ELECTRON_NAME: FLASHApp

jobs:
  build-vue-js-component:
    runs-on: ubuntu-latest

    steps:

    # Step to set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '21'

    # Step to clone the Vue.js repository
    - name: Checkout Vue.js repository
      uses: actions/checkout@v4
      with:
        repository: 't0mdavid-m/openms-streamlit-vue-component'
        ref: 'FVdeploy'
        path: 'openms-streamlit-vue-component'

    - name: Install and build Vue.js component
      run: |
        cd openms-streamlit-vue-component
        npm install
        npm run build

    - name: Upload dist as artifact
      uses: actions/upload-artifact@v4
      with:
        name: vue-js-dist
        path: openms-streamlit-vue-component/dist

  build-openms-windows:
    # The latest OpenMS/contrib Windows release is built on Windows Server 2025
    # with Visual Studio 2026; linking it with an older MSVC fails on missing STL
    # symbols (__std_rotate, __std_unique_4, ...).
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        repository: t0mdavid-m/OpenMS
        # Same branch as the Docker image (Dockerfile OPENMS_BRANCH); it has FLASHAnnotator.
        ref: FDmerge
        path: 'OpenMS'

    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'    ## Note this version is build with win64_msvc2022_64 and should always match what we use
        arch: 'win64_msvc2022_64'
        cache: 'false'
        archives: 'qtsvg qtimageformats qtbase'

    # https://github.com/marketplace/actions/visual-studio-shell
    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Setup build tools
      shell: bash
      run: |
        choco install ccache ninja -y --no-progress
        choco install cmake --version=3.31.1 -y --no-progress --force
        # FDmerge no longer finds Eigen in contrib; its own CI installs it from choco.
        choco install eigen -y --no-progress
        ## GH CLI "SHOULD BE" installed. Sometimes I had to manually install nonetheless. Super weird.
        # https://github.com/actions/runner-images/blob/main/images/win/scripts/Installers/Install-GitHub-CLI.ps1
        echo "C:/Program Files (x86)/GitHub CLI" >> $GITHUB_PATH

    - name: Extract branch/PR infos
      shell: bash
      run: |
        cd OpenMS
        RUN_NAME_LOCAL=$(echo ${GITHUB_REF#refs/heads/} | tr / -)
        echo "RUN_NAME=${RUN_NAME_LOCAL}" >> $GITHUB_ENV
        echo "BASE_REF=$(gh pr view --json baseRefName -q .baseRefName || echo ${RUN_NAME_LOCAL})" >> $GITHUB_ENV
      id: extract_branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache contrib
      id: cache-contrib-win
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/OpenMS/contrib
        # FDmerge builds against the latest contrib release, as its own CI does.
        key: ${{ runner.os }}-contrib-latest-${{ hashFiles('OpenMS/vcpkg.json') }}

    - name: Load contrib build
      if: steps.cache-contrib-win.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd OpenMS/contrib
        # Download the file using the URL fetched from GitHub
        gh release download -R OpenMS/contrib --pattern 'contrib_build-Windows.tar.gz'
        # Extract the archive
        tar -xzf contrib_build-Windows.tar.gz
        rm contrib_build-Windows.tar.gz
        ls

    - name: Add contrib to PATH
      shell: bash
      run: |
        # Add contrib library path for runtime DLL resolution
        echo "${{ github.workspace }}/OpenMS/contrib/lib" >> $GITHUB_PATH

    - name: Restore ccache cache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ env.RUN_NAME }}-${{ github.run_number }}
        # Restoring: From current branch, otherwise from base branch, otherwise from any branch.
        restore-keys: |
          ${{ runner.os }}-ccache-${{ env.RUN_NAME }}
          ${{ runner.os }}-ccache-${{ env.BASE_REF }}
          ${{ runner.os }}-ccache-

    - name: Add THIRDPARTY
      shell: bash
      run: |
          # initialize THIRDPARTY
          cd OpenMS
          git submodule update --init THIRDPARTY
          cd ..
          # add third-party binaries to PATH
          # use flat THIRDPARTY structure
          mkdir -p _thirdparty
          cp -R OpenMS/THIRDPARTY/Windows/x86_64/* _thirdparty/
          cp -R OpenMS/THIRDPARTY/All/* _thirdparty/
          # add third-party binaries to PATH
          for thirdpartytool in ${{ github.workspace }}/_thirdparty/*
          do
            echo $thirdpartytool >> $GITHUB_PATH
          done

    - name: Build Windows
      shell: bash
      run: |
          mkdir $GITHUB_WORKSPACE/OpenMS/bld/
          set +e
          ctest --output-on-failure -V -S $GITHUB_WORKSPACE/OpenMS/tools/ci/cibuild.cmake
          retVal=$?
          if [ $retVal -ne 0 ]; then
            # The errors otherwise only reach CDash.
            echo "::group::Compiler errors"
            find $GITHUB_WORKSPACE/OpenMS/bld/Testing -name "LastBuild*" -type f -exec grep -n -B2 -A12 -E "error C[0-9]+|error LNK|fatal error|FAILED:" {} \; | head -n 600
            echo "::endgroup::"
          fi
          exit $retVal
      env:
          OPENMS_CONTRIB_LIBS: "${{ github.workspace }}/OpenMS/contrib"
          CI_PROVIDER: "GitHub-Actions"
          CMAKE_GENERATOR: "Ninja"
          SOURCE_DIRECTORY: "${{ github.workspace }}/OpenMS"
          BUILD_NAME: "${{ env.RUN_NAME }}-Win64-class-topp-${{ github.run_number }}"
          ENABLE_STYLE_TESTING: "OFF"
          # Only the TOPP tools are packaged; building the tests would double the build time.
          ENABLE_TOPP_TESTING: "OFF"
          ENABLE_CLASS_TESTING: "OFF"
          WITH_GUI: "OFF"
          CMAKE_PREFIX_PATH: "${{ env.QT_ROOT_DIR }}/lib/cmake;${{ env.QT_ROOT_DIR }}"
          Eigen3_DIR: 'C:\ProgramData\chocolatey\lib\eigen\share\cmake'
          USE_EXTERNAL_JSON: "OFF"
          # The parameter docs run the freshly built tools during the build and are not shipped.
          ENABLE_DOCS: "OFF"
          WITH_PARQUET: "OFF"
          ADDRESS_SANITIZER: "Off"
          BUILD_TYPE: "Release"
          OPENMP: "On"
          USE_STATIC_BOOST: "On"
          # FDmerge's cibuild.cmake reads these names instead of the three above.
          CMAKE_BUILD_TYPE: "Release"
          MT_ENABLE_OPENMP: "ON"
          BOOST_USE_STATIC: "ON"
          #  BUILD_FLAGS: "-p:CL_MPCount=2" # For VS Generator and MSBuild
          BUILD_FLAGS: "-j4" # Ninja will otherwise use all cores (doesn't go well in GHA)
          CMAKE_CCACHE_EXE: "ccache"
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 12
          CCACHE_MAXSIZE: 400M

    - name: Save ccache cache
      # Also after a failed build, so the next attempt does not start cold.
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ env.RUN_NAME }}-${{ github.run_number }}-${{ github.run_attempt }}

    - name: Package
      shell: bash
      run: |
          ctest --output-on-failure -V -S $GITHUB_WORKSPACE/OpenMS/tools/ci/cipackage.cmake
      env:
          SOURCE_DIRECTORY: "${{ github.workspace }}/OpenMS"
          PACKAGE_TYPE: zip
          SEARCH_ENGINES_DIRECTORY: "${{ github.workspace }}/_thirdparty"
          CI_PROVIDER: "GitHub-Actions"
          CPACK_PACKAGE_FILE_NAME: "openms-package"

    #- name: Test Windows
    #  shell: bash
    #  run: $LAUNCHER ctest --output-on-failure -V -S $GITHUB_WORKSPACE/OpenMS/tools/ci/citest.cmake
    #  env:
    #      LAUNCHER: ""
    #     SOURCE_DIRECTORY: "${{ github.workspace }}/OpenMS"
    #     CI_PROVIDER: "GitHub-Actions"
    #     BUILD_NAME: "${{ env.RUN_NAME }}-Win64-class-topp-${{ github.run_number }}"

    - name: Upload package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: openms-package
        path: ${{ github.workspace }}/OpenMS/bld/*.zip

    - name: Collect the MSVC runtime the tools were built with
      # Shipped next to the TOPP tools, so they do not depend on an older
      # VC++ redistributable installed on the user's machine.
      shell: bash
      run: |
        mkdir vc-runtime
        redist=$(cygpath -u "$VCToolsRedistDir")
        cp -v "$redist"/x64/Microsoft.VC*.CRT/*.dll "$redist"/x64/Microsoft.VC*.OpenMP/*.dll vc-runtime/

    - name: Upload MSVC runtime as artifact
      uses: actions/upload-artifact@v4
      with:
        name: vc-runtime
        path: vc-runtime

  windows:
    runs-on: windows-2022
    permissions:
      contents: read
    needs: [build-openms-windows, build-vue-js-component]

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Download vue js as artifact
      uses: actions/download-artifact@v4
      with:
        name: vue-js-dist
        path: js-dist

    - name: Set Version in settings.json
      run: |
        # Only release builds carry a tag; other builds keep settings.json's
        # version instead of blanking it in the app's sidebar.
        $VERSION="${{ github.event.release.tag_name }}"
        if ($VERSION) {
          $content = Get-Content -Raw settings.json | ConvertFrom-Json
          $content.version = $VERSION
          $content | ConvertTo-Json -Depth 100 | Set-Content settings.json
        }

    - name: Download package as artifact
      uses: actions/download-artifact@v4
      with:
        name: openms-package
        path: openms-package

    - name: Extract bin and share from package
      run: |
        cd openms-package
        unzip "*.zip" -d .
        cp -r openms-package/bin ../openms-bin
        cp -r openms-package/share ../share

    - name: Download MSVC runtime as artifact
      uses: actions/download-artifact@v4
      with:
        name: vc-runtime
        path: openms-bin

    - name: Set up Python (regular distribution)
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }} # Use the same version as the embeddable version
    
    - name: Setup python embeddable version
      run: |
        # Create a directory for the embeddable Python version
        mkdir python-${{ env.PYTHON_VERSION }}
        
        # Download and unzip the embeddable Python version
        curl -O https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/python-${{ env.PYTHON_VERSION }}-embed-amd64.zip
        unzip python-${{ env.PYTHON_VERSION }}-embed-amd64.zip -d python-${{ env.PYTHON_VERSION }}
        rm python-${{ env.PYTHON_VERSION }}-embed-amd64.zip

        # Define paths for the regular Python distribution and the embeddable distribution
        $PYTHON_DIR="${{ runner.tool_cache }}/Python/${{ env.PYTHON_VERSION }}/x64" # Path from actions/setup-python
        $EMBED_DIR="python-${{ env.PYTHON_VERSION }}"
        
        mkdir -p $EMBED_DIR/Lib/site-packages/tkinter
        mkdir -p $EMBED_DIR/tcl

        # Copy necessary Tkinter files from the regular Python distribution
        cp -r $PYTHON_DIR/Lib/tkinter/* $EMBED_DIR/Lib/site-packages/tkinter/
        cp -r $PYTHON_DIR/tcl/* $EMBED_DIR/tcl/
        cp $PYTHON_DIR/DLLs/_tkinter.pyd $EMBED_DIR/
        cp $PYTHON_DIR/DLLs/tcl86t.dll $EMBED_DIR/
        cp $PYTHON_DIR/DLLs/tk86t.dll $EMBED_DIR/

    - name: Uncomment 'import site' in python311._pth file
      run: |
        sed -i 's/#import site/import site/' python-${{ env.PYTHON_VERSION }}/python311._pth

    - name: Install Required Packages
      # Use system Python (which has pip and dev headers) to compile packages,
      # installing into the embeddable Python's site-packages directory.
      run: |
        python -m pip install -r requirements.txt --target python-${{ env.PYTHON_VERSION }}/Lib/site-packages --upgrade --no-warn-script-location
        python -m pip install 'polars-lts-cpu >= 1.0' --target python-${{ env.PYTHON_VERSION }}/Lib/site-packages --upgrade --no-warn-script-location

    - name: Set to offline deployment
      run: |
        $content = Get-Content -Raw settings.json | ConvertFrom-Json
        $content.online_deployment = $false
        $content | ConvertTo-Json -Depth 100 | Set-Content settings.json

    - name: Create All-in-one executable folder
      run: |
        mkdir streamlit_exe

        mv python-${{ env.PYTHON_VERSION }} streamlit_exe
        cp -r src streamlit_exe
        cp -r content streamlit_exe
        cp -r assets streamlit_exe
        cp -r static streamlit_exe
        cp -r example-data streamlit_exe
        cp openms-bin/*.dll streamlit_exe
        cp -r .streamlit streamlit_exe
        cp -r share streamlit_exe/share
        cp -r js-component streamlit_exe/js-component
        cp app.py streamlit_exe
        cp settings.json streamlit_exe
        cp default-parameters.json streamlit_exe
        # Parameter presets of the workflows; without it the preset buttons are missing.
        if (Test-Path presets.json) { cp presets.json streamlit_exe }

        $files = $env:TOPP_TOOLS -split ' '
        foreach ($file in $files) {
          Copy-Item "openms-bin/${file}.exe" -Destination "streamlit_exe/${file}.exe"
        }

    - name: Remove server address for local Windows deployment
      run: |
        (Get-Content streamlit_exe/.streamlit/config.toml) -notmatch '^address' | Set-Content streamlit_exe/.streamlit/config.toml

    - name: Set up Node.js for the Electron installer
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: electron/package-lock.json

    - name: Build Electron installer
      # Wraps the folder in the Electron shell (electron/) as a per-user NSIS
      # installer that needs no admin rights.
      run: |
        Copy-Item -Recurse streamlit_exe electron/payload
        # electron-builder needs a semver version; take it from settings.json.
        $version = (Get-Content -Raw settings.json | ConvertFrom-Json).version
        if ("${{ github.event.release.tag_name }}" -match '(\d+)(?:\.(\d+))?(?:\.(\d+))?') {
          $version = "$($Matches[1]).$(if ($Matches[2]) { $Matches[2] } else { 0 }).$(if ($Matches[3]) { $Matches[3] } else { 0 })"
        }
        if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "1.0.0" }
        cd electron
        npm ci
        npx electron-builder --win nsis --publish never `
          "-c.productName=${{ env.ELECTRON_NAME }}" `
          "-c.appId=de.openms.${{ env.ELECTRON_NAME }}" `
          "-c.extraMetadata.productName=${{ env.ELECTRON_NAME }}" `
          "-c.extraMetadata.version=$version" `
          ('-c.nsis.artifactName=${{ env.APP_NAME }}-Setup.${ext}')

    - name: Smoke test Electron installer
      # Installs silently, then checks pyOpenMS, every TOPP tool and the
      # Streamlit server with the shell's environment, and finally launches the
      # installed app, which exits 0 once the page has created a workspace.
      run: |
        Start-Process -FilePath "electron/dist/${{ env.APP_NAME }}-Setup.exe" -ArgumentList "/S" -Wait
        $inst = Join-Path $env:LOCALAPPDATA "Programs/${{ env.ELECTRON_NAME }}"
        node electron/scripts/smoke-payload.js "$inst/resources/app-payload" @($env:TOPP_TOOLS -split ' ')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $env:OPENMS_APP_SMOKE_TEST = "1"
        $app = Start-Process -FilePath "$inst/${{ env.ELECTRON_NAME }}.exe" -PassThru
        if (-not $app.WaitForExit(300000)) { Stop-Process -Id $app.Id -Force; throw "Electron app did not finish its smoke test" }
        $log = Join-Path $env:APPDATA "${{ env.ELECTRON_NAME }}/logs/streamlit.log"
        if (Test-Path $log) { Get-Content $log }
        if ($app.ExitCode -ne 0) { throw "Electron app smoke test failed with exit code $($app.ExitCode)" }

    - name: End-to-end test in the Electron window
      # Drives the installed app with Playwright: opens every page, runs the
      # FLASHDeconv and FLASHTnT workflows (incl. FLASHAnnotator) on the
      # example data, and checks that each Viewer draws its plots and tables.
      run: |
        $inst = Join-Path $env:LOCALAPPDATA "Programs/${{ env.ELECTRON_NAME }}"
        node electron/scripts/e2e.js --exe "$inst/${{ env.ELECTRON_NAME }}.exe" --out e2e-output --scenario tests/e2e/electron-workflows.js
        $code = $LASTEXITCODE
        $log = Join-Path $env:APPDATA "${{ env.ELECTRON_NAME }}/logs/streamlit.log"
        if (Test-Path $log) { Get-Content $log -Tail 200 }
        exit $code

    - name: Archive end-to-end screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: electron-e2e-screenshots
        path: e2e-output
        if-no-files-found: ignore

    - name: Archive Electron installer
      uses: actions/upload-artifact@v4
      with:
        name: OpenMS-App-Electron
        path: electron/dist/${{ env.APP_NAME }}-Setup.exe

  # ---- macOS (Apple Silicon) and Linux (x86_64) ----

  # FLASHApp needs TOPP tools that are not in an OpenMS release yet
  # (FLASHAnnotator, the current FLASHTnT), so OpenMS is built from the same
  # branch as the Docker image and the Windows installer, and packaged the way
  # OpenMS packages its releases: a .pkg on macOS, a .deb on Linux.
  build-openms-unix:
    name: OpenMS ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only; Intel Macs are not supported.
          - platform: macOS-arm64
            runs-on: macos-15
            tp_folder: MacOS
            package_type: pkg
          # Built on the oldest Ubuntu we support: the bundle needs glibc >= 2.35.
          - platform: Linux-x86_64
            runs-on: ubuntu-22.04
            tp_folder: Linux
            package_type: deb
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 340
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout OpenMS
      uses: actions/checkout@v4
      with:
        repository: t0mdavid-m/OpenMS
        # Same branch as the Docker image (Dockerfile OPENMS_BRANCH); it has FLASHAnnotator.
        ref: FDmerge
        path: OpenMS
        persist-credentials: false

    - name: Install build dependencies
      id: deps
      env:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      run: |
        if [[ $RUNNER_OS == macOS ]]; then
          bash OpenMS/tools/ci/deps-macos.sh
          # Homebrew's eigen is 5.x; OpenMS asks for Eigen 3.4. Eigen is
          # header-only, so install 3.4.0's headers and CMake config aside.
          eigen3="$RUNNER_TEMP/eigen3"
          curl -fsSL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz | tar -xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/eigen-3.4.0" -B "$RUNNER_TEMP/eigen-build" -DCMAKE_INSTALL_PREFIX="$eigen3" -DBUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF >/dev/null
          cmake --install "$RUNNER_TEMP/eigen-build" >/dev/null
          echo "cmake_prefix=$eigen3;$(brew --prefix qt)/lib/cmake;$(brew --prefix qt);$(brew --prefix libomp)" >> "$GITHUB_OUTPUT"
          echo "eigen3_dir=$eigen3/share/eigen3/cmake" >> "$GITHUB_OUTPUT"
          # AppleClang has no OpenMP of its own; FindOpenMP looks in OpenMP_ROOT.
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "external_json=OFF" >> "$GITHUB_OUTPUT"
        else
          bash OpenMS/tools/ci/deps-ubuntu.sh
          echo "cmake_prefix=" >> "$GITHUB_OUTPUT"
          # Ubuntu's Arrow packages bring their own nlohmann_json (see OpenMS's CI).
          echo "external_json=ON" >> "$GITHUB_OUTPUT"
        fi
        echo "jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_OUTPUT"

    - name: Add THIRDPARTY
      run: |
        git -C OpenMS submodule update --init THIRDPARTY
        # Flat folder of this platform's third-party tools; the package ships it
        # in share/OpenMS/THIRDPARTY (ThermoRawFileParser for FileConverter).
        mkdir -p _thirdparty
        cp -R "OpenMS/THIRDPARTY/${{ matrix.tp_folder }}/$(uname -m)"/* _thirdparty/
        cp -R OpenMS/THIRDPARTY/All/* _thirdparty/
        ls _thirdparty

    - name: Restore ccache cache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ${{ matrix.platform }}-ccache-${{ github.run_number }}
        restore-keys: |
          ${{ matrix.platform }}-ccache-

    - name: Build OpenMS
      run: |
        mkdir OpenMS/bld
        set +e
        ctest --output-on-failure -V -S "$GITHUB_WORKSPACE/OpenMS/tools/ci/cibuild.cmake"
        retVal=$?
        if [ $retVal -ne 0 ]; then
          # The errors otherwise only reach CDash.
          echo "::group::Configure log"
          find OpenMS/bld/Testing -name "LastConfigure*" -type f -exec tail -n 150 {} \;
          echo "::endgroup::"
          echo "::group::Compiler errors"
          find OpenMS/bld/Testing -name "LastBuild*" -type f -exec grep -n -B2 -A12 -E "error:|fatal error|FAILED:" {} \; | head -n 600
          echo "::endgroup::"
        fi
        exit $retVal
      env:
        CMAKE_PREFIX_PATH: ${{ steps.deps.outputs.cmake_prefix }}
        OPENMS_CONTRIB_LIBS: "${{ github.workspace }}/OpenMS/contrib"
        Eigen3_DIR: ${{ steps.deps.outputs.eigen3_dir }}
        CI_PROVIDER: "GitHub-Actions"
        CMAKE_GENERATOR: "Ninja"
        SOURCE_DIRECTORY: "${{ github.workspace }}/OpenMS"
        BUILD_NAME: "FLASHApp-${{ matrix.platform }}-topp-${{ github.run_number }}"
        ENABLE_STYLE_TESTING: "OFF"
        # Only the TOPP tools are packaged; building the tests would double the build time.
        ENABLE_TOPP_TESTING: "OFF"
        ENABLE_CLASS_TESTING: "OFF"
        WITH_GUI: "OFF"
        ENABLE_DOCS: "OFF"
        WITH_PARQUET: "OFF"
        USE_EXTERNAL_JSON: ${{ steps.deps.outputs.external_json }}
        SEARCH_ENGINES_DIRECTORY: "${{ github.workspace }}/_thirdparty"
        ADDRESS_SANITIZER: "Off"
        BUILD_TYPE: "Release"
        CMAKE_BUILD_TYPE: "Release"
        OPENMP: "ON"
        MT_ENABLE_OPENMP: "ON"
        BOOST_USE_STATIC: "OFF"
        BUILD_FLAGS: "-j${{ steps.deps.outputs.jobs }}"
        CMAKE_CCACHE_EXE: "ccache"
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_COMPRESS: true
        CCACHE_COMPRESSLEVEL: 12
        CCACHE_MAXSIZE: 500M
        CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime
        CCACHE_COMPILERCHECK: content

    - name: Save ccache cache
      # Also after a failed build, so the next attempt does not start cold.
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ${{ matrix.platform }}-ccache-${{ github.run_number }}-${{ github.run_attempt }}

    - name: Package OpenMS
      run: |
        if [[ $RUNNER_OS == macOS ]]; then
          # Without the GUI there are no Qt plugins, and fix_dependencies.rb
          # aborts on the missing plugin folder before it fixes the TOPP tools'
          # library paths. Skip the plugin folder when it does not exist.
          sed -i '' 's|\$plugin_dir = Pathname.new(arg).realpath$|$plugin_dir = Pathname.new(arg).realpath if File.directory?(arg)|' OpenMS/cmake/MacOSX/fix_dependencies.rb
          grep -n 'plugin_dir = Pathname' OpenMS/cmake/MacOSX/fix_dependencies.rb
        fi
        set +e
        ctest --output-on-failure -V -S "$GITHUB_WORKSPACE/OpenMS/tools/ci/cipackage.cmake"
        retVal=$?
        if [ $retVal -ne 0 ]; then
          find OpenMS/bld/Testing -name "LastBuild*" -type f -exec tail -n 200 {} \;
        fi
        ls -la OpenMS/bld/*.${{ matrix.package_type }} || true
        exit $retVal
      env:
        SOURCE_DIRECTORY: "${{ github.workspace }}/OpenMS"
        PACKAGE_TYPE: ${{ matrix.package_type }}
        SEARCH_ENGINES_DIRECTORY: "${{ github.workspace }}/_thirdparty"
        CI_PROVIDER: "GitHub-Actions"
        BUILD_NAME: "FLASHApp-${{ matrix.platform }}-topp-${{ github.run_number }}"
        # Ad-hoc signature only: electron-builder signs every binary in the app
        # again with the Developer ID certificate.
        SIGNING_IDENTITY: "-"

    - name: Upload package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: openms-package-${{ matrix.platform }}
        path: OpenMS/bld/*.${{ matrix.package_type }}
        if-no-files-found: error
        retention-days: 7

  macos-linux:
    name: App ${{ matrix.platform }}
    permissions:
      contents: read
    needs: build-openms-unix
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runs-on: macos-15
          - platform: Linux-x86_64
            runs-on: ubuntu-22.04
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set version and offline deployment in settings.json
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # Only release builds carry a tag; other builds keep settings.json's version.
        jq --arg v "$RELEASE_TAG" \
          '.online_deployment = false | if $v != "" then .version = $v else . end' \
          settings.json > settings.tmp && mv settings.tmp settings.json

    - name: Download OpenMS package
      uses: actions/download-artifact@v4
      with:
        name: openms-package-${{ matrix.platform }}
        path: openms-package

    - name: Stage OpenMS TOPP tools
      # The macOS .pkg is already self-contained; from the .deb the script also
      # copies the system libraries (Qt, Xerces, ...) into the bundle.
      run: |
        export OPENMS_PACKAGE
        OPENMS_PACKAGE=$(find openms-package -maxdepth 1 \( -name "*.pkg" -o -name "*.deb" \) | head -n 1)
        electron/scripts/stage-openms.sh "" electron/payload $TOPP_TOOLS

    - name: Stage Python with the app's requirements
      run: |
        electron/scripts/stage-python.sh "$PYTHON_STANDALONE_VERSION" electron/payload requirements.txt
        if [[ $RUNNER_OS == Linux ]]; then
          # Same as the Windows build: polars' default wheel needs AVX2 and
          # more; the LTS build runs on any x86_64 CPU. Both ship the polars/
          # package, so remove the default one first: installing over it mixed
          # files of two versions (ImportError in polars.io).
          py="electron/payload/python-$PYTHON_STANDALONE_VERSION/bin/python3"
          "$py" -m pip uninstall -y --disable-pip-version-check polars $("$py" -m pip list --format=freeze --disable-pip-version-check | grep -o '^polars-runtime[^=]*' || true)
          "$py" -m pip install --no-warn-script-location --disable-pip-version-check 'polars-lts-cpu >= 1.0, < 2'
          "$py" -c 'import polars, polars.io.delta; print("polars", polars.__version__)'
        fi

    - name: Copy the app into the payload
      run: |
        p=electron/payload
        cp -R src content assets static example-data js-component .streamlit app.py settings.json default-parameters.json presets.json "$p/"
        # The local server only listens on loopback; the shell passes the address.
        grep -v '^address' "$p/.streamlit/config.toml" > config.tmp && mv config.tmp "$p/.streamlit/config.toml"
        "$p/python-$PYTHON_STANDALONE_VERSION/bin/python3" -m compileall -q --invalidation-mode unchecked-hash "$p/src"
        du -sh "$p"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: electron/package-lock.json

    - name: Build installers
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        # electron-builder needs a semver version; take it from settings.json or the release tag.
        version=$(jq -r .version settings.json)
        if [[ "$RELEASE_TAG" =~ ([0-9]+)(\.([0-9]+))?(\.([0-9]+))? ]]; then
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[3]:-0}.${BASH_REMATCH[5]:-0}"
        fi
        [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || version=1.0.0
        # Package and executable name: lowercase, so two apps never share a deb package.
        id=$(tr '[:upper:]' '[:lower:]' <<<"$ELECTRON_NAME")
        args=(
          --publish never
          "-c.productName=$ELECTRON_NAME"
          "-c.appId=de.openms.$ELECTRON_NAME"
          "-c.extraMetadata.name=$id"
          # Electron takes the Linux app_id / WM_CLASS from desktopName; the .desktop
          # entry (deb, and the one the AppImage writes) must match it for the icon.
          "-c.extraMetadata.desktopName=$id.desktop"
          "-c.extraMetadata.productName=$ELECTRON_NAME"
          "-c.extraMetadata.version=$version"
          "-c.linux.synopsis=Visualization of top-down proteomics results from FLASHDeconv, FLASHTnT and FLASHQuant"
        )
        if [[ $RUNNER_OS == macOS ]]; then
          # Notarization runs in the afterSign hook, which retries Apple's flaky
          # stapling service instead of failing the build.
          args+=(--mac dmg --arm64 "-c.dmg.artifactName=$APP_NAME-macOS-arm64.\${ext}"
            -c.mac.notarize=false -c.afterSign=scripts/notarize.js)
          # dmgbuild's size estimate leaves too little room for the tens of
          # thousands of small payload files (ditto: No space left on device).
          # The image is shrunk and compressed afterwards, so headroom is free.
          payload_mb=$(du -sm electron/payload | cut -f1)
          args+=("-c.dmg.size=$((payload_mb * 2 + 1024))m")
          if [[ -n $MACOS_CERTIFICATE ]]; then
            export CSC_LINK="$MACOS_CERTIFICATE" CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
            # electron-builder skips signing in pull requests by default. Only PRs from
            # branches of this repository see the secret, so sign those too.
            export CSC_FOR_PULL_REQUEST=true
            # Notarize with an App Store Connect API key, or else with an Apple ID
            # and an app-specific password.
            if [[ -n $APPLE_API_KEY_CONTENT ]]; then
              printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" APPLE_API_KEY_ID APPLE_API_ISSUER
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            elif [[ -n $APPLE_ID ]]; then
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            else
              echo "::warning::neither APPLE_API_KEY nor APPLE_ID is set: the app is signed but not notarized"
            fi
          else
            # Forks and pull requests from forks get no secrets: build unsigned.
            echo "::warning::MACOS_CERTIFICATE is not set: the app is not signed"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID
          fi
        else
          args+=(--linux AppImage deb --x64
            "-c.linux.executableName=$id"
            "-c.appImage.artifactName=$APP_NAME-Linux-x86_64.\${ext}"
            "-c.deb.artifactName=$APP_NAME-Linux-amd64.\${ext}")
        fi
        # The signer opens every file of the payload (tens of thousands) at once;
        # lift macOS's per-process limit above that.
        if [[ $RUNNER_OS == macOS ]]; then
          sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=524288 >/dev/null
          ulimit -n 524288
          echo "open-file limit: $(ulimit -n), payload files: $(find electron/payload -type f | wc -l)"
        fi
        cd electron
        npm ci
        npx electron-builder "${args[@]}"
        rm -f "$RUNNER_TEMP/AuthKey.p8"
        ls -la dist

    - name: Smoke test (macOS)
      if: runner.os == 'macOS'
      env:
        SIGNED: ${{ secrets.MACOS_CERTIFICATE != '' }}
        NOTARIZED: ${{ secrets.APPLE_API_KEY != '' || secrets.APPLE_ID != '' }}
      run: |
        # Runs the app from the mounted (read-only) dmg, the way users first start it.
        mnt="$RUNNER_TEMP/dmg"
        hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "electron/dist/$APP_NAME-macOS-arm64.dmg"
        app="$mnt/$ELECTRON_NAME.app"
        if [[ $SIGNED == true ]]; then
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
          if [[ $NOTARIZED == true ]]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
        fi
        node electron/scripts/smoke-payload.js "$app/Contents/Resources/app-payload" $TOPP_TOOLS

        OPENMS_APP_SMOKE_TEST=1 "$app/Contents/MacOS/$ELECTRON_NAME" &
        pid=$!
        for _ in $(seq 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
        if kill -0 $pid 2>/dev/null; then kill $pid; echo "::error::app did not finish its smoke test"; exit 1; fi
        wait $pid && code=0 || code=$?
        cat "$HOME/Library/Application Support/$ELECTRON_NAME/logs/streamlit.log" || true
        exit $code

    - name: Smoke test (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install -y -q libfuse2 xvfb
        image="$PWD/electron/dist/$APP_NAME-Linux-x86_64.AppImage"
        chmod +x "$image"

        # The deb installs to /opt/<product name>; check its payload too.
        sudo apt-get install -y -q "./electron/dist/$APP_NAME-Linux-amd64.deb"
        node electron/scripts/smoke-payload.js "/opt/$ELECTRON_NAME/resources/app-payload" $TOPP_TOOLS

        (cd "$RUNNER_TEMP" && "$image" --appimage-extract >/dev/null)
        node electron/scripts/smoke-payload.js "$RUNNER_TEMP/squashfs-root/resources/app-payload" $TOPP_TOOLS

        code=0
        OPENMS_APP_SMOKE_TEST=1 timeout 300 xvfb-run -a "$image" || code=$?
        cat "$HOME/.config/$ELECTRON_NAME/logs/streamlit.log" || true
        exit $code

    - name: End-to-end test in the app window
      # Drives the installed app with Playwright: opens every page, runs the
      # FLASHDeconv and FLASHTnT workflows (incl. FLASHAnnotator) on the
      # example data, and checks that each Viewer draws its plots and tables.
      run: |
        scenario=tests/e2e/electron-workflows.js
        if [[ $RUNNER_OS == macOS ]]; then
          exe="$RUNNER_TEMP/dmg/$ELECTRON_NAME.app/Contents/MacOS/$ELECTRON_NAME"
          log="$HOME/Library/Application Support/$ELECTRON_NAME/logs/streamlit.log"
          node electron/scripts/e2e.js --exe "$exe" --out e2e-output --scenario "$scenario" && code=0 || code=$?
        else
          # The extracted AppImage, with APPIMAGE set as its runtime would.
          exe="$RUNNER_TEMP/squashfs-root/$(tr '[:upper:]' '[:lower:]' <<<"$ELECTRON_NAME")"
          log="$HOME/.config/$ELECTRON_NAME/logs/streamlit.log"
          APPIMAGE="$PWD/electron/dist/$APP_NAME-Linux-x86_64.AppImage" \
            xvfb-run -a node electron/scripts/e2e.js --exe "$exe" --out e2e-output --scenario "$scenario" && code=0 || code=$?
        fi
        tail -n 200 "$log" || true
        exit $code

    - name: Archive end-to-end screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: electron-e2e-screenshots-${{ matrix.platform }}
        path: e2e-output
        if-no-files-found: ignore

    - name: Archive installers
      uses: actions/upload-artifact@v4
      with:
        name: OpenMS-App-${{ matrix.platform }}
        path: |
          electron/dist/*.dmg
          electron/dist/*.AppImage
          electron/dist/*.deb

  # One release job for all platforms. Only this job can write to the
  # repository; the build jobs run third-party code (pip, npm, electron-builder)
  # with a read-only token.
  release:
    needs: [windows, macos-linux]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download installers
      uses: actions/download-artifact@v4
      with:
        pattern: OpenMS-App-*
        merge-multiple: true
        path: dist

    - name: Upload installers as release assets
      run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}

  publish-web-image:
    # On a published Release, run the full Build-and-Test pipeline AFTER the
    # installers (incl. <APP_NAME>-Setup.exe) have been uploaded as release assets,
    # so the Docker build's `gh release download` bundles the matching
    # installer. build-and-test.yml builds the image, runs the apptainer +
    # nginx + traefik integration tests, and only then stitches and pushes the
    # multi-arch `:latest` (and versioned) tags that the k8s prod overlay pulls.
    needs: release
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit
