# App spec: what this app is. Schema and checker come from the template
# (utils/app_spec.schema.json, `python -m utils.app_spec`); the weekly
# template-sync job reads `template:` and `sync.app_owned` from here.
# App-owned: template syncs never overwrite this file.
spec_version: 1
template:
  repository: OpenMS/streamlit-template
  branch: main
app:
  slug: flashapp
  name: FLASHApp
  description: 'Top-down proteomics: FLASHDeconv deconvolution, FLASHTnT tag-based identification and
    label-free or TMT/iTRAQ quantification, with a configurable linked viewer.'
  repository: OpenMS/FLASHApp
  domain: top-down-proteomics
  image: ghcr.io/openms/flashapp
inputs:
  mzML-files:
    types:
    - mzML
    - raw
    - d
    multiple: true
    description: Top-down LC-MS runs; .raw and .d are converted.
  fasta-file:
    types:
    - fasta
    - peff
    multiple: false
    description: Protein database for FLASHTnT.
workflows:
- name: FLASHTnT
  class: src/Workflow.py:TopDownWorkflow
  inputs:
  - mzML-files
  - fasta-file
  steps:
  - tool: DecoyDatabase
    in: fasta-file
    optional: true
  - tool: FLASHDeconv
    in: mzML-files
  - tool: FLASHTnT
    in: FLASHDeconv
    optional: true
  - tool: FLASHAnnotator
    optional: true
  - tool: FLASHQuantConsensus
    optional: true
results:
- role: custom
  workflow: FLASHTnT
  title: Viewer (Vue grid)
  page: content/TopDown/TopDownViewer.py
pages:
- content/quickstart.py
- content/user_guide.py
- content/TopDown/TopDownUpload.py
- content/TopDown/TopDownConfigure.py
- content/TopDown/TopDownRun.py
- content/TopDown/TopDownSequenceInput.py
- content/TopDown/TopDownViewer.py
- content/TopDown/TopDownDownload.py
deploy:
  k8s:
    enabled: true
    hosts:
    - flashapp.webapps.openms.de
    - flashapp.webapps.openms.org
    worker_tier: high
  docker_compose: true
  desktop:
  - windows
  online_deployment: false
sync:
  app_owned:
  - app.yaml
  - app.py
  - settings.json
  - default-parameters.json
  - presets.json
  - README.md
  - content/*
  - src/python-tools/*
  - example-data/*
  - assets/*
  - k8s/overlays/*
  - k8s/argocd/*
  - .github/workflows/build-and-test.yml
  - .github/kind-config.yaml
  - CLAUDE.app.md
  - src/Workflow.py
  - js-component/*
  - .gitmodules
  - openms-streamlit-vue-component
  - src/parse/*
  - src/render/*
  - tests/test_tasks.py
  - tests/test_workspace_sync.py
  - tests/test_seed_demos.py
  - tests/test_run_manager.py
